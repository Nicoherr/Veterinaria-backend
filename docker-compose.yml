services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vetsm
      MYSQL_USER: vetsm
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-vetsm_dev_password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-vetsm_root_dev_password}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/vetsm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: vetsm
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD:-vetsm_dev_password}"
      JWT_SECRET: "${JWT_SECRET:-VetSM-local-development-secret-change-before-deploy-2026}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
