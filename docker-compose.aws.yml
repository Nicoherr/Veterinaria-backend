services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vetsm
      MYSQL_USER: vetsm
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en backend/.env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en backend/.env}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SPRING_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/vetsm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: vetsm
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en backend/.env}"
      JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET en backend/.env}"
      CORS_ALLOWED_ORIGINS: "http://${PUBLIC_IP:?Define PUBLIC_IP en backend/.env}"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../Veterinaria-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://${PUBLIC_IP:?Define PUBLIC_IP en backend/.env}:${SPRING_PORT:-8080}/api"
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
