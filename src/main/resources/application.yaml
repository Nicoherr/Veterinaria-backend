spring:
  application:
    name: vetsm-backend
  datasource:
    url: jdbc:h2:mem:vetsm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true
app:
  jwt:
    # Replace JWT_SECRET with a long random value outside local development.
    secret: ${JWT_SECRET:VetSM-local-development-secret-change-before-deploy-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
