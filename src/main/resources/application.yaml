spring:
  application:
    name: vetsm-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vetsm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:vetsm}
    password: ${SPRING_DATASOURCE_PASSWORD:vetsm_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  jwt:
    # Replace JWT_SECRET with a long random value outside local development.
    secret: ${JWT_SECRET:VetSM-local-development-secret-change-before-deploy-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
